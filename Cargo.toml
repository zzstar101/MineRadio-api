[package]
name = "MineRadio-api"
version = "0.1.0"
edition = "2024"

[lib]
name = "mineradio_api"
path = "src/lib.rs"

[features]
default = ["__rustls", "rustls-tls-native-roots"]
__rustls = []
native-tls = []
rustls-tls-native-roots = []
rustls-tls-webpki-roots = []

[profile.dev]
opt-level = 0
debug = 0
incremental = true
codegen-units = 256
lto = false

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1

[build-dependencies]
protobuf-codegen = "3"

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
anyhow = "1"
async-tungstenite = { version = "0.29", default-features = false, features = ["tokio-runtime", "tokio-rustls-native-certs"] }
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
byteorder = "1.5"
bytes = "1"
cbc = "0.1"
ctr = "0.9"
data-encoding = "2.9"
dotenvy = "0.15"
ecb = "0.1"
flate2 = "1"
form_urlencoded = "1.2"
futures-core = "0.3"
futures = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "bilock", "unstable"] }
governor = { version = "0.10", default-features = false, features = ["std"] }
hmac = "0.12"
http = "1.3"
http-body-util = "0.1"
httparse = "1.10"
hyper = { version = "1.6", features = ["http1", "http2"] }
hyper-proxy2 = { version = "0.1", default-features = false, features = ["rustls"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "native-tokio"] }
hyper-util = { version = "0.1", default-features = false, features = ["client", "http1", "http2"] }
log = "0.4"
md-5 = "0.10"
nonzero_ext = "0.3"
num-bigint = "0.4"
num-derive = "0.4"
num-integer = "0.1"
num-traits = "0.2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
pin-project-lite = "0.2"
priority-queue = "2.5"
protobuf = "3.7"
protobuf-json-mapping = "3.7"
quick-xml = { version = "0.38", features = ["serialize"] }
rand = "0.10"
rand_core = "0.10"
regex = "1"
rumqttc = "0.25.1"
reqwest = { version = "0.12", features = ["json", "cookies", "stream", "rustls-tls"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
qrcode-generator = "5"
rquickjs = "0.12"
rsa = { version = "0.9", features = ["pem"] }
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
symphonia = { version = "0.6", default-features = false, features = ["mp3"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
urlencoding = "2"
memchr = "2.8.3"
sha1 = { version = "0.10", features = ["oid"] }
hex = "0.4.3"
shannon = "0.2"
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio-stream = { version = "0.1", default-features = false }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7", default-features = false }
uuid = { version = "1", default-features = false, features = ["v4"] }
